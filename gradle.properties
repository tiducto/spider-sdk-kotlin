kotlin.code.style=official

# KMP / Android needs the AndroidX namespace
android.useAndroidX=true

# Avoid daemon noise on JDK 25
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Cross-compiled targets (iosX64/macosX64) can't run tests on an arm64 host; don't warn.
kotlin.native.ignoreDisabledTargets=true
