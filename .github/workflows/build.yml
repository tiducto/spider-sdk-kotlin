name: Build SDK

# Compiles the whole KMP library AND the :examples module. The examples are a Gradle
# subproject that depends on :client, so `./gradlew build` type-checks them against the
# real SDK — a stale or wrong example (bad API, wrong error-code casing) fails the build.
# This is both the PR merge gate and the first stage of the release pipeline.
#
# Runs on macOS because the repo declares Apple targets (iosArm64/macos*), which can't
# compile on Linux. Draft PRs skip it; ready_for_review re-triggers. Exposed via
# workflow_call so release.yml runs it before publishing — a tag on a broken commit
# never reaches Maven Central. Concurrency cancels superseded pushes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip draft PRs; still runs on workflow_dispatch / workflow_call (no pull_request context).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build KMP library + examples (all targets)
        run: ./gradlew build --console=plain
