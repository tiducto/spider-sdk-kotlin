name: publish

# Publishes the Spider Kotlin SDK (:client) to GitHub Packages' Maven registry.
#
# Manual dispatch only. The published version is the module's `version` in build.gradle.kts — bump it
# before dispatching, since GitHub Packages rejects republishing an existing version. Runs on macOS
# because the KMP library declares Apple targets (iosArm64/macos*), which can't compile on Linux. Auth
# uses the built-in GITHUB_TOKEN (packages: write), so no PAT/secret is needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish to GitHub Packages
        run: ./gradlew publish --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
