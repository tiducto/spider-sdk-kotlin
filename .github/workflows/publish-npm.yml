name: publish npm

# Publishes the Kotlin/JS library distribution of :client to GitHub Packages' npm registry as
# @tiducto/spider-sdk-client (the JS counterpart of the Maven publish in client/build.gradle.kts).
#
# Manual dispatch only. The published version is client/build.gradle.kts `version` — bump it before
# dispatching, since npm rejects republishing an existing version. Auth uses the built-in
# GITHUB_TOKEN (packages: write), so no PAT/secret is needed. JS-only, so this runs on Linux
# (the Apple/Native targets are skipped) rather than the macOS runner build.yml needs.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tiducto'
      - name: Build JS library distribution
        run: ./gradlew :client:jsBrowserDevelopmentLibraryDistribution --console=plain
      - name: Publish to GitHub Packages (npm)
        working-directory: client/build/dist/js/developmentLibrary
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
