name: Release

# Release pipeline: build -> publish -> refresh-context, chained so each stage gates the next.
# A semver tag push (X.Y.Z) IS the release action (also manual dispatch).
#
#   build            reuses build.yml (workflow_call): compiles all targets + :examples + tests,
#                    so a tag on a broken commit never reaches Maven Central.
#   publish          needs build. Uploads :client to the Sonatype Central Portal (vanniktech
#                    plugin). Published version comes from version.properties (contract.patch),
#                    NOT the tag; a guard fails the run on tag/version drift.
#   refresh-context  needs publish. Re-indexes Context7 (reuses context7-refresh.yml) only
#                    after the artifact is actually live.
#
# Runs on macOS for the Apple targets. Credentials come from repo secrets. See RELEASING.md
# for the one-time account/secret setup.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight publish — a half-uploaded Central deployment is worse than a queue.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      - name: Verify tag matches version.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          contract="$(grep '^contract=' version.properties | cut -d= -f2)"
          patch="$(grep '^patch=' version.properties | cut -d= -f2)"
          version="${contract}.${patch}"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.properties (${version}). Bump version.properties or retag."
            exit 1
          fi
          echo "Releasing version ${version}."

      # --no-configuration-cache: releasing to Maven Central is a known configuration-cache exception
      # in the vanniktech plugin (a Gradle limitation), so it is disabled for this task only.
      - name: Publish to Maven Central (Sonatype Central Portal)
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_TOKEN_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}

  refresh-context:
    needs: publish
    uses: ./.github/workflows/context7-refresh.yml
    secrets: inherit
