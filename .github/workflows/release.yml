name: release

# Publishes the Spider Kotlin SDK (:client) to Maven Central via the Sonatype Central Portal, using
# the vanniktech maven-publish plugin.
#
# Triggers on a semver tag push (X.Y.Z) — pushing the tag IS the release action — and on manual
# dispatch. The published version comes from version.properties (contract.patch), NOT the tag name;
# a guard step fails the run if a pushed tag doesn't match that version so the two can't silently
# diverge. Runs on macOS because the KMP library declares Apple targets (iosArm64/macos*) that can't
# compile on Linux.
#
# Credentials are passed as ORG_GRADLE_PROJECT_* env vars sourced from repo secrets (never
# hardcoded): the Central Portal user token as mavenCentralUsername/Password and the ASCII-armored
# GPG private key + its passphrase as signingInMemoryKey/KeyPassword. See RELEASING.md for the
# one-time account/secret setup required before the first release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight publish — a half-uploaded Central deployment is worse than a queue.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      - name: Verify tag matches version.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          contract="$(grep '^contract=' version.properties | cut -d= -f2)"
          patch="$(grep '^patch=' version.properties | cut -d= -f2)"
          version="${contract}.${patch}"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.properties (${version}). Bump version.properties or retag."
            exit 1
          fi
          echo "Releasing version ${version}."

      # --no-configuration-cache: releasing to Maven Central is a known configuration-cache exception
      # in the vanniktech plugin (a Gradle limitation), so it is disabled for this task only.
      - name: Publish to Maven Central (Sonatype Central Portal)
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_TOKEN_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
